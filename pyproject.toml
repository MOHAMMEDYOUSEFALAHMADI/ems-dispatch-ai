[project]
name = "ems-dispatch-ai"
version = "0.1.0"
description = "Demand forecasting, ambulance posting optimisation and dispatch simulation for Riyadh (synthetic data)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mohammed Alahmadi"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "pydeck>=0.8"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/generate.py" = ["E501"]
"**/test_*.py" = ["E501"]
